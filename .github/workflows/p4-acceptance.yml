name: P4 view semantics acceptance

on:
  pull_request:
    paths:
      - 'src/blacksite/**'
      - 'scripts/accept_p4_netbbs.py'
      - 'scripts/accept_s10_netbbs.py'
      - '.github/workflows/p4-acceptance.yml'
  workflow_dispatch:

jobs:
  semantics-netbbs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        size: ['80x24', '132x50']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Thiesi/NetBBS
          ref: v7.45.0
          path: .test-tmp/netbbs
      - name: Install NetBBS and isolated native door wheel
        shell: bash
        run: |
          python -m pip install './.test-tmp/netbbs[ssh,web]'
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/p4-wheels"
          python -m venv "$RUNNER_TEMP/p4-venv"
          "$RUNNER_TEMP/p4-venv/bin/python" -m pip install "$RUNNER_TEMP"/p4-wheels/*.whl
      - name: Accept semantic fields and place history through native stdio
        shell: bash
        run: |
          python scripts/accept_p4_netbbs.py --root "$RUNNER_TEMP/p4-proof" --door-python "$RUNNER_TEMP/p4-venv/bin/python" --size '${{ matrix.size }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-view-semantics-${{ matrix.size }}
          path: |
            ${{ runner.temp }}/p4-proof/*.ans
            ${{ runner.temp }}/p4-proof/*.txt
            ${{ runner.temp }}/p4-proof/*.json
            ${{ runner.temp }}/p4-proof/progress.log
