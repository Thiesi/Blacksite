name: S43 S04 acceptance at pinned submitted source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  door-s04:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_HEAD: a0b1a15f155889228e59e2071f8d9deaada05abb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Thiesi/NetBBS
          ref: v7.45.0
          path: .test-tmp/netbbs
      - name: Build an isolated wheel from the exact S43 source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          proof="$RUNNER_TEMP/karst41-proof/s43-s04"
          python -m pip install './.test-tmp/netbbs[ssh,web]'
          python -m pip wheel --no-deps . -w "$proof/wheels"
          python -m venv "$proof/venv"
          "$proof/venv/bin/python" -m pip install --no-index "$proof"/wheels/*.whl
      - name: Verify source and installed client identity
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess
          proof = pathlib.Path(os.environ['RUNNER_TEMP'])/'karst41-proof/s43-s04'
          source = pathlib.Path('src/karst41')
          def digest(root):
              h = hashlib.sha256()
              for p in sorted(root.rglob('*.py')):
                  h.update(p.relative_to(root).as_posix().encode()+b'\0'+p.read_bytes().replace(b'\r\n',b'\n')+b'\0')
              return h.hexdigest()
          checker = "import hashlib,json,karst41;from pathlib import Path\nroot=Path(karst41.__file__).parent;h=hashlib.sha256()\nfor p in sorted(root.rglob('*.py')): h.update(p.relative_to(root).as_posix().encode()+b'\\0'+p.read_bytes().replace(b'\\r\\n',b'\\n')+b'\\0')\nprint(json.dumps({'version':karst41.__version__,'python_tree_sha256':h.hexdigest()}))"
          client = json.loads(subprocess.check_output([str(proof/'venv/bin/python'),'-I','-c',checker]))
          head = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head == os.environ['SOURCE_HEAD']
          assert digest(source) == client['python_tree_sha256'] == '84f609a7602278c0def16831492dec96c98782ee913ae2e10f3ce67588fddeda'
          out = proof/'captures'
          out.mkdir(parents=True,exist_ok=True)
          (out/'source-identity.json').write_text(json.dumps({'source_head':head,'workflow_head':os.environ['GITHUB_SHA'],'client':client,'python_tree_sha256':digest(source)},indent=2)+'\n')
      - name: Run unchanged S04 at both sizes and all transports
        shell: bash
        run: |
          proof="$RUNNER_TEMP/karst41-proof/s43-s04"
          python scripts/accept_s04_netbbs.py --root "$proof/captures" --door-python "$proof/venv/bin/python"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s43-s04-pinned-proof
          path: ${{ runner.temp }}/karst41-proof/s43-s04/captures
      - name: Remove fixed proof scratch
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/karst41-proof/s43-s04"
