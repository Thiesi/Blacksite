name: R1 package and native title acceptance

on:
  pull_request:
    paths:
      - 'src/karst41/**'
      - 'pyproject.toml'
      - 'scripts/accept_r1_netbbs.py'
      - 'scripts/audit_r1_world.py'
      - 'scripts/r1_title.py'
      - 'scripts/check_r1_titles.py'
      - '.github/workflows/r1-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  title-only-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify only the approved title and fill cells changed
        run: python scripts/check_r1_titles.py --output "$RUNNER_TEMP/karst41-proof/r1-title-diff/result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: r1-title-only-diff
          path: ${{ runner.temp }}/karst41-proof/r1-title-diff/result.json

  door-s04:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Thiesi/NetBBS
          ref: v7.45.0
          path: .test-tmp/netbbs
      - name: Install NetBBS and the isolated door wheel
        shell: bash
        run: |
          python -m pip install './.test-tmp/netbbs[ssh,web]'
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/karst41-proof/r1-s04/wheels"
          python -m venv "$RUNNER_TEMP/karst41-proof/r1-s04/venv"
          "$RUNNER_TEMP/karst41-proof/r1-s04/venv/bin/python" -m pip install --no-index "$RUNNER_TEMP"/karst41-proof/r1-s04/wheels/*.whl
      - name: Run complete S04 acceptance at both sizes
        shell: bash
        run: |
          python scripts/accept_s04_netbbs.py --root "$RUNNER_TEMP/karst41-proof/r1-s04/captures" --door-python "$RUNNER_TEMP/karst41-proof/r1-s04/venv/bin/python"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-s04-proof
          path: ${{ runner.temp }}/karst41-proof/r1-s04/captures
      - name: Remove proof scratch
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/karst41-proof/r1-s04"

  title-netbbs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        size: ['80x24', '132x50']
        tier: ['16', '256', 'truecolor']
        presentation: ['default', 'p5']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Thiesi/NetBBS
          ref: v7.45.0
          path: .test-tmp/netbbs
      - name: Build the wheel and install it in a clean venv
        shell: bash
        run: |
          python -m pip install './.test-tmp/netbbs[ssh,web]'
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/karst41-proof/r1/wheels"
          python -m venv "$RUNNER_TEMP/karst41-proof/r1/venv"
          "$RUNNER_TEMP/karst41-proof/r1/venv/bin/python" -m pip install --no-index "$RUNNER_TEMP"/karst41-proof/r1/wheels/*.whl
      - name: Capture the live title and audit the real persisted world
        shell: bash
        run: |
          python scripts/accept_r1_netbbs.py --root "$RUNNER_TEMP/karst41-proof/r1/captures" --door-python "$RUNNER_TEMP/karst41-proof/r1/venv/bin/python" --size '${{ matrix.size }}' --tier '${{ matrix.tier }}' --presentation '${{ matrix.presentation }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-title-${{ matrix.presentation }}-${{ matrix.size }}-${{ matrix.tier }}
          path: |
            ${{ runner.temp }}/karst41-proof/r1/captures/*.ans
            ${{ runner.temp }}/karst41-proof/r1/captures/*.txt
            ${{ runner.temp }}/karst41-proof/r1/captures/*.json
            ${{ runner.temp }}/karst41-proof/r1/captures/progress.log
      - name: Remove native proof scratch
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/karst41-proof/r1"
