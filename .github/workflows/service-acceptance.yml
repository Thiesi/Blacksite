      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s25-services-proof-${{ matrix.case }}-${{ matrix.size }}
          path: |
            ${{ runner.temp }}/s25-services/**/*.ans
            ${{ runner.temp }}/s25-services/**/*.txt
            ${{ runner.temp }}/s25-services/**/*.json
            ${{ runner.temp }}/s25-services/**/progress.log

