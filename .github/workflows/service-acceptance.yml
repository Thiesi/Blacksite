name: Service and shared-zone acceptance

on:
  pull_request:
    paths:
      - 'src/blacksite/**'
      - 'deploy/**'
      - 'scripts/accept_s05_systemd.py'
      - 'scripts/accept_s06_netbbs.py'
      - 'scripts/accept_s07_netbbs.py'
      - 'scripts/accept_s08_netbbs.py'
      - 'scripts/accept_s09_netbbs.py'
      - 'scripts/accept_s12_netbbs.py'
      - 'scripts/accept_s10_netbbs.py'
      - 'scripts/accept_s11_netbbs.py'
      - 'scripts/accept_s13_netbbs.py'
      - 'scripts/accept_s14_netbbs.py'
      - 'scripts/accept_s15_netbbs.py'
      - '.github/workflows/service-acceptance.yml'
      - 'pyproject.toml'
      - 'MANIFEST.in'

concurrency:
  group: service-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  interlock-netbbs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Thiesi/NetBBS
          ref: v7.31.0
          path: .test-tmp/netbbs
      - name: Build and install the wheel for real interlock acceptance
        shell: bash
        run: |
          python -m pip install './.test-tmp/netbbs[ssh,web]'
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/s15-wheels"
          python -m venv "$RUNNER_TEMP/s15-venv"
          "$RUNNER_TEMP/s15-venv/bin/python" -m pip install "$RUNNER_TEMP"/s15-wheels/*.whl
      - name: Accept physical control flips and guarded power cuts
        shell: bash
        run: |
          python scripts/accept_s15_netbbs.py --root "$RUNNER_TEMP/s15-proof/controls" --door-python "$RUNNER_TEMP/s15-venv/bin/python"
      - name: Accept private core theft and resident logs
        shell: bash
        run: |
          python scripts/accept_s15_netbbs.py --root "$RUNNER_TEMP/s15-proof/private" --door-python "$RUNNER_TEMP/s15-venv/bin/python" --stage private
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s15-interlock-proof
          path: |
            ${{ runner.temp }}/s15-proof/**/*.ans
            ${{ runner.temp }}/s15-proof/**/*.txt
            ${{ runner.temp }}/s15-proof/**/*results.json
            ${{ runner.temp }}/s15-proof/**/failure-state.json
            ${{ runner.temp }}/s15-proof/**/progress.log
  encounters-netbbs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Thiesi/NetBBS
          ref: v7.31.0
          path: .test-tmp/netbbs
      - name: Build and install the wheel for real encounter acceptance
        shell: bash
        run: |
          python -m pip install './.test-tmp/netbbs[ssh,web]'
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/s14-wheels"
          python -m venv "$RUNNER_TEMP/s14-venv"
          "$RUNNER_TEMP/s14-venv/bin/python" -m pip install "$RUNNER_TEMP"/s14-wheels/*.whl
      - name: Accept fresh training through NetBBS at both sizes
        shell: bash
        run: |
          python scripts/accept_s14_netbbs.py --root "$RUNNER_TEMP/s14-proof/training" --door-python "$RUNNER_TEMP/s14-venv/bin/python"
      - name: Accept public loan Silt procedures and seeded replay
        shell: bash
        run: |
          python scripts/accept_s14_netbbs.py --root "$RUNNER_TEMP/s14-proof/silt" --door-python "$RUNNER_TEMP/s14-venv/bin/python" --stage silt
      - name: Accept black body feedback and Hound retreat with labelled fixtures
        shell: bash
        run: |
          python scripts/accept_s14_netbbs.py --root "$RUNNER_TEMP/s14-proof/danger" --door-python "$RUNNER_TEMP/s14-venv/bin/python" --stage danger
      - name: Accept solo and shared Gate Nine receipt fixtures
        shell: bash
        run: |
          python scripts/accept_s14_netbbs.py --root "$RUNNER_TEMP/s14-proof/gate-solo" --door-python "$RUNNER_TEMP/s14-venv/bin/python" --stage gate-solo
          python scripts/accept_s14_netbbs.py --root "$RUNNER_TEMP/s14-proof/gate-duo" --door-python "$RUNNER_TEMP/s14-venv/bin/python" --stage gate-duo
      - name: Accept runner selection and Burn through real caller keys
        shell: bash
        run: |
          python scripts/accept_s14_netbbs.py --root "$RUNNER_TEMP/s14-proof/burn" --door-python "$RUNNER_TEMP/s14-venv/bin/python" --stage burn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s14-encounter-proof
          path: ${{ runner.temp }}/s14-proof
  lattice-netbbs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Thiesi/NetBBS
          ref: v7.31.0
          path: .test-tmp/netbbs
      - name: Build and install the wheel for real Lattice acceptance
        shell: bash
        run: |
          python -m pip install './.test-tmp/netbbs[ssh,web]'
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/s13-wheels"
          python -m venv "$RUNNER_TEMP/s13-venv"
          "$RUNNER_TEMP/s13-venv/bin/python" -m pip install "$RUNNER_TEMP"/s13-wheels/*.whl
      - name: Accept bodies and Lattice traversal through NetBBS
        shell: bash
        run: |
          python scripts/accept_s13_netbbs.py --root "$RUNNER_TEMP/s13-proof" --door-python "$RUNNER_TEMP/s13-venv/bin/python"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s13-lattice-proof
          path: ${{ runner.temp }}/s13-proof
  npcs-netbbs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Thiesi/NetBBS
          ref: v7.31.0
          path: .test-tmp/netbbs
      - name: Build and install the wheel for real NPC acceptance
        shell: bash
        run: |
          python -m pip install './.test-tmp/netbbs[ssh,web]'
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/s11-wheels"
          python -m venv "$RUNNER_TEMP/s11-venv"
          "$RUNNER_TEMP/s11-venv/bin/python" -m pip install "$RUNNER_TEMP"/s11-wheels/*.whl
      - name: Accept NPCs and actual heat deadlines through NetBBS
        shell: bash
        run: |
          python scripts/accept_s11_netbbs.py --root "$RUNNER_TEMP/s11-proof" --door-python "$RUNNER_TEMP/s11-venv/bin/python"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-npcs-proof
          path: ${{ runner.temp }}/s11-proof
  combat-netbbs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Thiesi/NetBBS
          ref: v7.31.0
          path: .test-tmp/netbbs
      - name: Build and install the wheel for real combat acceptance
        shell: bash
        run: |
          python -m pip install './.test-tmp/netbbs[ssh,web]'
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/s10-wheels"
          python -m venv "$RUNNER_TEMP/s10-venv"
          "$RUNNER_TEMP/s10-venv/bin/python" -m pip install "$RUNNER_TEMP"/s10-wheels/*.whl
      - name: Accept combat through NetBBS native stdio at both sizes
        shell: bash
        run: |
          python scripts/accept_s10_netbbs.py --root "$RUNNER_TEMP/s10-proof" --door-python "$RUNNER_TEMP/s10-venv/bin/python"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s10-combat-proof
          path: ${{ runner.temp }}/s10-proof
  systemd-netbbs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Thiesi/NetBBS
          ref: v7.31.0
          path: .test-tmp/netbbs
      - name: Build wheel and prepare isolated service account installation
        shell: bash
        run: |
          python -m pip install './.test-tmp/netbbs[ssh,web]'
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/s05-wheels"
          python -m venv "$RUNNER_TEMP/s05-venv"
          "$RUNNER_TEMP/s05-venv/bin/python" -m pip install "$RUNNER_TEMP"/s05-wheels/*.whl
          mkdir "$RUNNER_TEMP/s05-world"
          "$RUNNER_TEMP/s05-venv/bin/blacksite" admin --install-dir "$RUNNER_TEMP/s05-world" validate --json
          python - <<'PY'
          import grp, os, pwd
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          unit = Path('deploy/systemd/blacksite.service').read_text()
          unit = unit.replace('/opt/blacksite/venv', str(root / 's05-venv'))
          unit = unit.replace('/var/db/blacksite', str(root / 's05-world'))
          unit = unit.replace('User=netbbs', 'User=' + pwd.getpwuid(os.getuid()).pw_name)
          unit = unit.replace('Group=netbbs', 'Group=' + grp.getgrgid(os.getgid()).gr_name)
          (root / 'blacksite-s05.service').write_text(unit)
          PY
          sudo cp "$RUNNER_TEMP/blacksite-s05.service" /etc/systemd/system/blacksite-s05.service
          sudo systemctl daemon-reload
          sudo systemctl enable blacksite-s05.service
      - name: Accept real systemd lifecycle through NetBBS native stdio
        shell: bash
        run: |
          python scripts/accept_s05_systemd.py --root "$RUNNER_TEMP/s05-proof" --install-dir "$RUNNER_TEMP/s05-world" --python "$RUNNER_TEMP/s05-venv/bin/python" --unit blacksite-s05.service
      - name: Service diagnostics and cleanup
        if: always()
        shell: bash
        run: |
          sudo journalctl -u blacksite-s05 --no-pager || true
          sudo systemctl stop blacksite-s05.service || true
      - name: Accept shared zones through NetBBS Telnet and SSH
        shell: bash
        run: |
          python scripts/accept_s06_netbbs.py --root "$RUNNER_TEMP/s06-proof" --door-python "$RUNNER_TEMP/s05-venv/bin/python"
      - name: Accept the Wake, restart and real sleeper interval
        shell: bash
        run: |
          python scripts/accept_s07_netbbs.py --root "$RUNNER_TEMP/s07-proof" --door-python "$RUNNER_TEMP/s05-venv/bin/python"
      - name: Accept real city walking and scheduled trams
        shell: bash
        run: |
          python scripts/accept_s08_netbbs.py --root "$RUNNER_TEMP/s08-proof" --door-python "$RUNNER_TEMP/s05-venv/bin/python"
      - name: Accept social routing and log UI through NetBBS
        shell: bash
        run: |
          python scripts/accept_s09_netbbs.py --root "$RUNNER_TEMP/s09-proof" --door-python "$RUNNER_TEMP/s05-venv/bin/python"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s05-linux-service-proof
          path: ${{ runner.temp }}/s05-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s06-shared-zone-proof
          path: ${{ runner.temp }}/s06-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s07-character-proof
          path: ${{ runner.temp }}/s07-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s08-city-proof
          path: ${{ runner.temp }}/s08-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s09-social-proof
          path: ${{ runner.temp }}/s09-proof
      - name: Accept hub inventory, vendors, caches and banking through NetBBS
        shell: bash
        run: |
          python scripts/accept_s12_netbbs.py --root "$RUNNER_TEMP/s12-proof" --door-python "$RUNNER_TEMP/s05-venv/bin/python"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s12-commerce-proof
          path: ${{ runner.temp }}/s12-proof
