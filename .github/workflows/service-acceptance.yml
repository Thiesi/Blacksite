name: S11 publisher diagnosis (no acceptance credit)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare unchanged source trees
        shell: bash
        run: |
          PROOF="$RUNNER_TEMP/blacksite-proof/s11-publishers"
          echo "PROOF=$PROOF" >> "$GITHUB_ENV"
          mkdir -p "$PROOF/output"
          git worktree add --detach "$PROOF/pre" aef69d989ba48658d7feb2ba5e3f3375d167c90b
          git worktree add --detach "$PROOF/main" 7597dce6f1263a27421c51ec97cff1b0b91b6f68
      - name: Compare frozen scenes in ABBA order on one runner
        shell: bash
        run: |
          for arm in pre1 main1 main2 pre2; do
            source=pre
            [[ "$arm" == main* ]] && source=main
            python -B scripts/diagnose_s11_publishers.py --source "$PROOF/$source" --output "$PROOF/output/$arm.json" --label "$arm"
          done
      - name: Verify matched fixture and output fingerprints
        shell: python
        run: |
          import json, os, pathlib
          root = pathlib.Path(os.environ['PROOF'])/'output'
          reports = [json.loads((root/(arm+'.json')).read_text()) for arm in ('pre1','main1','main2','pre2')]
          for index in range(6):
              cases = [r['cases'][index] for r in reports]
              assert len({c['fixture_sha256'] for c in cases}) == 1, 'Fixture states differ'
              assert len({json.dumps(c['body_sha256'], sort_keys=True) for c in cases}) == 1, 'Output documents differ'
              assert len({c['nearby_count'] for c in cases}) == 1
          print('All scene and body fingerprints match; diagnostic measurements only.')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-publisher-diagnosis
          path: ${{ env.PROOF }}/output
      - name: Remove source checkouts and scratch
        if: always()
        shell: bash
        run: |
          git worktree remove "$PROOF/pre" || true
          git worktree remove "$PROOF/main" || true
          rm -rf "$PROOF"
