name: P3 interaction focus acceptance

on:
  pull_request:
    paths:
      - 'src/blacksite/**'
      - 'scripts/accept_p3_netbbs.py'
      - 'scripts/accept_s10_netbbs.py'
      - '.github/workflows/p3-acceptance.yml'
  workflow_dispatch:

jobs:
  focus-netbbs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        size: ['80x24', '132x50']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Thiesi/NetBBS
          ref: v7.45.0
          path: .test-tmp/netbbs
      - name: Install NetBBS and isolated native door wheel
        shell: bash
        run: |
          python -m pip install './.test-tmp/netbbs[ssh,web]'
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/p3-wheels"
          python -m venv "$RUNNER_TEMP/p3-venv"
          "$RUNNER_TEMP/p3-venv/bin/python" -m pip install "$RUNNER_TEMP"/p3-wheels/*.whl
      - name: Verify E and J predictions through native stdio
        shell: bash
        run: |
          python scripts/accept_p3_netbbs.py --root "$RUNNER_TEMP/p3-proof" --door-python "$RUNNER_TEMP/p3-venv/bin/python" --size '${{ matrix.size }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-interaction-focus-${{ matrix.size }}
          path: |
            ${{ runner.temp }}/p3-proof/*.ans
            ${{ runner.temp }}/p3-proof/*.txt
            ${{ runner.temp }}/p3-proof/*.json
            ${{ runner.temp }}/p3-proof/progress.log
