name: S25a engine acceptance

on:
  pull_request:
    paths:
      - 'src/karst41/**'
      - 'scripts/accept_s25a_netbbs.py'
      - 'scripts/accept_s10_netbbs.py'
      - 'scripts/accept_s11_netbbs.py'
      - '.github/workflows/s25a-acceptance.yml'
  workflow_dispatch:

# A new commit supersedes earlier runs of the same PR or branch; main is
# never cancelled, and each main commit keeps its own group.
concurrency:
  group: s25a-acceptance-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  engine-netbbs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        size: ['80x24', '132x50']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Thiesi/NetBBS
          ref: v7.45.0
          path: .test-tmp/netbbs
      - name: Install NetBBS and the isolated Karst 41 wheel
        shell: bash
        run: |
          python -m pip install './.test-tmp/netbbs[ssh,web]'
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/s25a-wheels"
          python -m venv "$RUNNER_TEMP/s25a-venv"
          "$RUNNER_TEMP/s25a-venv/bin/python" -m pip install "$RUNNER_TEMP"/s25a-wheels/*.whl
      - name: Exercise fixture interactions through native stdio
        shell: bash
        run: |
          python scripts/accept_s25a_netbbs.py --root "$RUNNER_TEMP/s25a-proof" --door-python "$RUNNER_TEMP/s25a-venv/bin/python" --size '${{ matrix.size }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s25a-engine-proof-${{ matrix.size }}
          path: ${{ runner.temp }}/s25a-proof
