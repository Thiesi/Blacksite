name: Round 4 demo native smoke

on:
  push:
    branches: [demo/sodium-row-round4]
    paths:
      - 'src/**'
      - 'docs/demo/sodium-row-round4/content/**'
      - 'scripts/demo_sodium/**'
      - '.github/workflows/demo-round4.yml'

permissions:
  contents: read

jobs:
  native-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Thiesi/NetBBS
          ref: v7.45.0
          path: .test-tmp/netbbs
      - name: Install NetBBS and the exact demo wheel
        shell: bash
        run: |
          python -m pip install './.test-tmp/netbbs[ssh,web]'
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/karst41-proof/wheels"
          python -m venv "$RUNNER_TEMP/karst41-proof/venv"
          "$RUNNER_TEMP/karst41-proof/venv/bin/python" -m pip install "$RUNNER_TEMP"/karst41-proof/wheels/*.whl
      - name: Exercise the demo through native stdio at both sizes
        shell: bash
        run: |
          python scripts/demo_sodium/prove.py --root "$RUNNER_TEMP/karst41-proof/demo-round4" --door-python "$RUNNER_TEMP/karst41-proof/venv/bin/python"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round4-demo-native
          path: ${{ runner.temp }}/karst41-proof/demo-round4
