name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}.
            Read AGENTS.md and inspect the diff and relevant source context.
            This feature PR requires review even when authored by a coding
            agent or when acceptance checks are still pending. Do not skip
            because another review comment exists; inspect the current head.
            Identify credible caller, operator, gameplay, security and
            data-loss problems. Give a realistic scenario and code link for
            each finding. Omit style nits and theoretical correctness changes
            with no practical impact. Do not modify code or create commits.
            Always post a written summary on this PR with gh pr comment,
            including when there are no actionable findings. State the SHA
            reviewed. Use the complete PR URL with gh commands. Inline
            comments may supplement the summary, never replace it.
          # Limit the reviewer to repository reads and review comments.
          claude_args: >-
            --allowedTools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

