name: S39 exit underfoot acceptance

on:
  pull_request:
    paths:
      - 'src/blacksite/**'
      - 'scripts/accept_s39_netbbs.py'
      - 'scripts/accept_s10_netbbs.py'
      - '.github/workflows/s39-acceptance.yml'
  workflow_dispatch:

jobs:
  exit-netbbs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        size: ['80x24', '132x50']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Thiesi/NetBBS
          ref: v7.45.0
          path: .test-tmp/netbbs
      - name: Install NetBBS and isolated native door wheel
        shell: bash
        run: |
          python -m pip install './.test-tmp/netbbs[ssh,web]'
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/blacksite-proof/s39/wheels"
          python -m venv "$RUNNER_TEMP/blacksite-proof/s39/venv"
          "$RUNNER_TEMP/blacksite-proof/s39/venv/bin/python" -m pip install "$RUNNER_TEMP"/blacksite-proof/s39/wheels/*.whl
      - name: Verify network route and exit versus mission focus
        shell: bash
        run: |
          python scripts/accept_s39_netbbs.py --root "$RUNNER_TEMP/blacksite-proof/s39/captures" --door-python "$RUNNER_TEMP/blacksite-proof/s39/venv/bin/python" --size '${{ matrix.size }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s39-exit-underfoot-${{ matrix.size }}
          path: |
            ${{ runner.temp }}/blacksite-proof/s39/captures/*.ans
            ${{ runner.temp }}/blacksite-proof/s39/captures/*.txt
            ${{ runner.temp }}/blacksite-proof/s39/captures/*.json
            ${{ runner.temp }}/blacksite-proof/s39/captures/progress.log
      - name: Remove native proof scratch
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/blacksite-proof/s39"
