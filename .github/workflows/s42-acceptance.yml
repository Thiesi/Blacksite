name: S42 talker reach acceptance

on:
  pull_request:
    paths:
      - 'src/karst41/**'
      - 'scripts/accept_s42_netbbs.py'
      - '.github/workflows/s42-acceptance.yml'
  workflow_dispatch:

# A new commit supersedes earlier runs of the same PR or branch; main is
# never cancelled, and each main commit keeps its own group.
concurrency:
  group: s42-acceptance-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  talker-netbbs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        size: ['80x24', '132x50']
        tier: ['16', '256', 'truecolor']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Thiesi/NetBBS
          ref: v7.45.0
          path: .test-tmp/netbbs
      - name: Install NetBBS and isolated native door wheel
        shell: bash
        run: |
          python -m pip install './.test-tmp/netbbs[ssh,web]'
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/karst41-proof/s42/wheels"
          python -m venv "$RUNNER_TEMP/karst41-proof/s42/venv"
          "$RUNNER_TEMP/karst41-proof/s42/venv/bin/python" -m pip install "$RUNNER_TEMP"/karst41-proof/s42/wheels/*.whl
      - name: Capture talk hint, one-press escape, flee and covered shot label
        shell: bash
        run: |
          python scripts/accept_s42_netbbs.py --root "$RUNNER_TEMP/karst41-proof/s42/captures" --door-python "$RUNNER_TEMP/karst41-proof/s42/venv/bin/python" --size '${{ matrix.size }}' --tier '${{ matrix.tier }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s42-talker-${{ matrix.size }}-${{ matrix.tier }}
          path: |
            ${{ runner.temp }}/karst41-proof/s42/captures/*.ans
            ${{ runner.temp }}/karst41-proof/s42/captures/*.txt
            ${{ runner.temp }}/karst41-proof/s42/captures/*.json
            ${{ runner.temp }}/karst41-proof/s42/captures/progress.log
      - name: Remove native proof scratch
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/karst41-proof/s42"
