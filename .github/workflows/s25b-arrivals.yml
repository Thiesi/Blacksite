name: S25b live arrival captures

on:
  pull_request:
    paths:
      - 'src/blacksite/**'
      - 'scripts/accept_s25b_arrivals.py'
      - 'scripts/build_city_content.py'
      - 'scripts/accept_s04_netbbs.py'
      - 'scripts/accept_s06_netbbs.py'
      - 'scripts/accept_s10_netbbs.py'
      - 'tests/fake_terminal.py'
      - 'tests/presentation/**'
      - 'docs/world/01-gazetteer.md'
      - 'pyproject.toml'
      - '.github/workflows/s25b-arrivals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arrival-netbbs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tier: ['16', '256', 'truecolor']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Thiesi/NetBBS
          ref: v7.31.0
          path: .test-tmp/netbbs
      - name: Install NetBBS and an isolated Blacksite wheel
        shell: bash
        run: |
          python -m pip install './.test-tmp/netbbs[ssh,web]'
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/s25b-arrival-wheels"
          python -m venv "$RUNNER_TEMP/s25b-arrival-venv"
          "$RUNNER_TEMP/s25b-arrival-venv/bin/python" -m pip install "$RUNNER_TEMP"/s25b-arrival-wheels/*.whl
      - name: Capture shipped hub and generated Undercity arrivals at both sizes
        shell: bash
        run: |
          python scripts/accept_s25b_arrivals.py --root "$RUNNER_TEMP/s25b-arrivals" --door-python "$RUNNER_TEMP/s25b-arrival-venv/bin/python" --tier '${{ matrix.tier }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s25b-arrivals-${{ matrix.tier }}
          path: |
            ${{ runner.temp }}/s25b-arrivals/result.json
            ${{ runner.temp }}/s25b-arrivals/shipped/arrival-*
            ${{ runner.temp }}/s25b-arrivals/generated/arrival-*
            ${{ runner.temp }}/s25b-arrivals/shipped/failed-launch-*
            ${{ runner.temp }}/s25b-arrivals/generated/failed-launch-*
            ${{ runner.temp }}/s25b-arrivals/shipped/unfinished-*
            ${{ runner.temp }}/s25b-arrivals/generated/unfinished-*
