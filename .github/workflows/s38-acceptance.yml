name: S38 truce acceptance

on:
  pull_request:
    paths:
      - 'src/blacksite/**'
      - 'tests/**'
      - 'scripts/accept_s38_netbbs.py'
      - 'scripts/accept_p4_netbbs.py'
      - 'scripts/accept_s10_netbbs.py'
      - 'scripts/accept_s16_netbbs.py'
      - '.github/workflows/s38-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s38-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  truce-netbbs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        size: ['80x24', '132x50']
        presentation: ['legacy', 'modern']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Thiesi/NetBBS
          ref: v7.45.0
          path: .test-tmp/netbbs
      - name: Install released NetBBS and isolated source-matched door wheel
        shell: bash
        run: |
          python -m pip install './.test-tmp/netbbs[ssh,web]'
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/s38-wheels"
          python -m venv "$RUNNER_TEMP/s38-door"
          "$RUNNER_TEMP/s38-door/bin/python" -m pip install "$RUNNER_TEMP"/s38-wheels/*.whl
      - name: Exercise the truce through a real PTY and native door
        shell: bash
        run: |
          size='${{ matrix.size }}'
          columns="${size%x*}"
          rows="${size#*x}"
          script -q -e -c "stty cols $columns rows $rows; python scripts/accept_s38_netbbs.py --root '$RUNNER_TEMP/s38-proof' --door-python '$RUNNER_TEMP/s38-door/bin/python' --size '$size' --presentation '${{ matrix.presentation }}' --show" "$RUNNER_TEMP/s38-console.ans"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s38-native-${{ matrix.size }}-${{ matrix.presentation }}
          path: |
            ${{ runner.temp }}/s38-proof/*.ans
            ${{ runner.temp }}/s38-proof/*.txt
            ${{ runner.temp }}/s38-proof/*.json
            ${{ runner.temp }}/s38-proof/progress.log
            ${{ runner.temp }}/s38-console.ans
