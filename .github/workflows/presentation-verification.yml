name: Presentation verification

on:
  pull_request:
    paths:
      - 'src/blacksite/**'
      - 'tests/**'
      - 'scripts/presentation_*.py'
      - '.github/workflows/presentation-verification.yml'
      - 'pyproject.toml'
  workflow_dispatch:

concurrency:
  group: presentation-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review-packet-cp437:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .[test]
      - name: Compare glyphs and styles and strictly audit every CP437 cell
        run: python scripts/presentation_packet.py --output "${{ runner.temp }}/p1-review" --strict-cp437
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-review-packet
          path: ${{ runner.temp }}/p1-review/

  shipped-door-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .[test]
      - name: Record CPU and bytes at both sizes and all colour tiers
        run: python scripts/presentation_baseline.py --output "${{ runner.temp }}/p1-baseline.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-shipped-door-baseline
          path: ${{ runner.temp }}/p1-baseline.json
