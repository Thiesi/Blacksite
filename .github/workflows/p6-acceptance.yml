name: P6 place engine acceptance

on:
  pull_request:
    paths:
      - 'src/blacksite/**'
      - 'tests/**'
      - 'scripts/accept_p6_netbbs.py'
      - 'scripts/presentation_p6.py'
      - 'scripts/presentation_p6_masks.py'
      - 'scripts/presentation_p6_validation.py'
      - 'scripts/presentation_p6_packet.py'
      - 'scripts/p6_golden_diff.py'
      - 'scripts/p6_cell_diff.py'
      - 'scripts/p6_camera_diff.py'
      - 'scripts/presentation_p6_camera.py'
      - 'scripts/presentation_p6_cpu.py'
      - '.github/workflows/p6-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p6-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu-a8:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {zone: core-plaza, population: shipped}
          - {zone: vatside-clinics, population: shipped}
          - {zone: sodium-row, population: shipped}
          - {zone: sodium-row, population: '11'}
          - {zone: sodium-row, population: '16'}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .[test]
      - name: Pair A8 with merged main on author-owned fixed-post data
        shell: bash
        run: |
          git fetch --no-tags origin f69541473704f1164cd5b5e8dbd315c2fa811504
          population='${{ matrix.population }}'
          extra=()
          if [ "$population" != shipped ]; then extra=(--npc-count "$population"); fi
          python scripts/presentation_p6_cpu.py --zone '${{ matrix.zone }}' "${extra[@]}" --output "$RUNNER_TEMP/p6-cpu.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-cpu-${{ matrix.zone }}-${{ matrix.population }}
          path: ${{ runner.temp }}/p6-cpu.json

  camera-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .[test]
      - name: Compare A7 origins using the unchanged B2 frame method
        shell: bash
        run: |
          git fetch --no-tags origin 0c4b19db5152c159601fafe63d55743549cc2474
          python scripts/presentation_p6_camera.py --output "$RUNNER_TEMP/p6-camera-budget.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-camera-budget
          path: ${{ runner.temp }}/p6-camera-budget.json

  charted-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .[test]
      - name: Reproduce the immutable merged A7 camera-only golden audit
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/p6-a7-proof" 54adc53c6686eb5b2430f2e90cd457a09332b833
          python -X utf8 "$RUNNER_TEMP/p6-a7-proof/scripts/p6_camera_diff.py" --output "$RUNNER_TEMP/p6-camera-cell-diff.json"
      - name: Measure supplied Plaza and Sodium Row region geometry
        run: python scripts/presentation_p6_masks.py --output "${{ runner.temp }}/p6-mask-geometry.json"
      - name: Validate A6 cache and sign policy on the pinned content input
        shell: bash
        run: |
          git fetch --no-tags origin 3e585c71eebf8c8cd19a591016dfe78a788c5b9b
          python scripts/presentation_p6_validation.py --output "${{ runner.temp }}/p6-validation.json"
      - name: Compare charted fixture generic/looks using the P1 CPU method
        run: python scripts/presentation_p6.py --output "${{ runner.temp }}/p6-charted-budget.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-charted-budget
          path: |
            ${{ runner.temp }}/p6-charted-budget.json
            ${{ runner.temp }}/p6-camera-cell-diff.json
            ${{ runner.temp }}/p6-mask-geometry.json
            ${{ runner.temp }}/p6-validation.json

  native-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        size: ['80x24', '132x50']
        theme: ['dark', 'light']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Thiesi/NetBBS
          ref: v7.45.0
          path: .test-tmp/netbbs
      - name: Install NetBBS and isolated source-matched native wheel
        shell: bash
        run: |
          python -m pip install './.test-tmp/netbbs[ssh,web]'
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/p6-wheels"
          python -m venv "$RUNNER_TEMP/p6-venv"
          "$RUNNER_TEMP/p6-venv/bin/python" -m pip install "$RUNNER_TEMP"/p6-wheels/*.whl
      - name: Capture P6a fixtures through an attached PTY and registered stdio door
        shell: bash
        run: |
          size='${{ matrix.size }}'
          columns="${size%x*}"
          rows="${size#*x}"
          script -q -e -c "stty cols $columns rows $rows; python scripts/accept_p6_netbbs.py --root '$RUNNER_TEMP/p6-proof' --door-python '$RUNNER_TEMP/p6-venv/bin/python' --size '$size' --theme '${{ matrix.theme }}' --show" "$RUNNER_TEMP/p6-console.ans"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-fixture-${{ matrix.theme }}-${{ matrix.size }}
          path: |
            ${{ runner.temp }}/p6-proof/*.ans
            ${{ runner.temp }}/p6-proof/*.txt
            ${{ runner.temp }}/p6-proof/*.json
            ${{ runner.temp }}/p6-proof/progress.log
            ${{ runner.temp }}/p6-console.ans
