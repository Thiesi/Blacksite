name: Native failure evidence export
on:
  push:
    branches: ['evidence/a8-export-426b8c0']
permissions:
  actions: read
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - {artifact: p4-view-semantics-132x50, run: 41219647058}
          - {artifact: s19-contract-proof-network-132x50, run: 41219647157}
          - {artifact: s23-market-proof-80x24, run: 41219647157}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thiesi/Blacksite
          run-id: ${{ matrix.run }}
      - name: Emit unfinished caller screen and bounded diagnostic tail
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          for path in sorted(Path('evidence').rglob('*')):
              if not path.is_file(): continue
              if (path.name.startswith('unfinished-') and path.suffix == '.txt') or path.name in ('failure-trace.txt','progress.log'):
                  raw = path.read_bytes()
                  print('P6B_DIAG '+json.dumps(dict(path=path.as_posix(),sha256=hashlib.sha256(raw).hexdigest(),text=raw.decode('utf-8')),ensure_ascii=True,separators=(',',':')))
              elif path.name == 'input-tail.json':
                  print('P6B_DIAG '+json.dumps(dict(path=path.as_posix(),inputs=json.loads(path.read_bytes())[-40:]),ensure_ascii=True,separators=(',',':')))
