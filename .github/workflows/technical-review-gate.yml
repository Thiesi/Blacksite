name: technical-review-gate

# Sets the `technical-review` commit status on each PR head from the
# decision records posted on the PR (docs/plan/04-technical-review.md §8).
# It enforces the procedure; it does not perform a review.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

jobs:
  gate:
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    concurrency:
      group: technical-review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # Always run the gate from the default branch, so a PR cannot change
      # the rule that judges it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate decision records
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: python scripts/technical_review_gate.py
