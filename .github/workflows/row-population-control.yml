name: Row population matched control

on:
  push:
    branches: [measure/row-population-184]
    paths:
      - scripts/measure_row_control.py
      - .github/workflows/row-population-control.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: row-population-control-${{ github.ref }}
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current pinned harness
        run: python -m pip install -e .[test]
      - name: Prepare historical control and prove unchanged A8 method
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          proof="$RUNNER_TEMP/blacksite-proof/row-population-184"
          mkdir -p "$proof/temp"
          git fetch --no-tags origin refs/pull/144/head
          git merge-base --is-ancestor 4ab6470b10821f9fddbac718615af7d56c6048eb FETCH_HEAD
          git fetch --no-tags origin dd489f9ec7676b2c37b553fa7587c4d0a4ed6d56
          git worktree add --detach "$proof/a8" 4ab6470b10821f9fddbac718615af7d56c6048eb
          git diff --exit-code 4ab6470b10821f9fddbac718615af7d56c6048eb HEAD -- scripts/presentation_p6_cpu.py tests/presentation/budget.py
      - name: Execute every predeclared arm on this one runner
        shell: bash
        run: |
          proof="$RUNNER_TEMP/blacksite-proof/row-population-184"
          TMPDIR="$proof/temp" python -B scripts/measure_row_control.py \
            --a8-root "$proof/a8" --output "$proof/control.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: row-population-matched-control
          path: |
            ${{ runner.temp }}/blacksite-proof/row-population-184/*.json
            ${{ runner.temp }}/blacksite-proof/row-population-184/*.log
          if-no-files-found: error
      - name: Remove historical worktree and scratch
        if: always()
        shell: bash
        run: |
          proof="$RUNNER_TEMP/blacksite-proof/row-population-184"
          if [ -d "$proof/a8" ]; then git worktree remove "$proof/a8"; fi
          rm -rf -- "$proof"
