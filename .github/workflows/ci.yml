name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # NetBSD is the production host but has no hosted runner; it is
    # verified by hand before each release (AGENTS.md section 5).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .[test]
      - name: Test
        run: pytest -q
