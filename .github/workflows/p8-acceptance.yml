name: P8 voice and ambience acceptance

on:
  pull_request:
    paths:
      - 'src/karst41/door/**'
      - 'src/karst41/server/**'
      - 'src/karst41/content/**'
      - 'scripts/accept_p8_netbbs.py'
      - '.github/workflows/p8-acceptance.yml'
  workflow_dispatch:

jobs:
  p8-netbbs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        size: ['80x24', '132x50']
        presentation: ['legacy', 'modern']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Thiesi/NetBBS
          ref: v7.45.0
          path: .test-tmp/netbbs
      - name: Install NetBBS and isolated native door wheel
        shell: bash
        run: |
          python -m pip install './.test-tmp/netbbs[ssh,web]'
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/karst41-proof/p8/wheels"
          python -m venv "$RUNNER_TEMP/karst41-proof/p8/venv"
          "$RUNNER_TEMP/karst41-proof/p8/venv/bin/python" -m pip install "$RUNNER_TEMP"/karst41-proof/p8/wheels/*.whl
      - name: Capture a bark, Row ambience and quiet in combat
        shell: bash
        run: |
          python scripts/accept_p8_netbbs.py --root "$RUNNER_TEMP/karst41-proof/p8/captures" --door-python "$RUNNER_TEMP/karst41-proof/p8/venv/bin/python" --size '${{ matrix.size }}' --presentation '${{ matrix.presentation }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p8-${{ matrix.size }}-${{ matrix.presentation }}
          path: |
            ${{ runner.temp }}/karst41-proof/p8/captures/*.ans
            ${{ runner.temp }}/karst41-proof/p8/captures/*.txt
            ${{ runner.temp }}/karst41-proof/p8/captures/*.json
            ${{ runner.temp }}/karst41-proof/p8/captures/failure-trace.txt
            ${{ runner.temp }}/karst41-proof/p8/captures/progress.log
      - name: Remove native proof scratch
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/karst41-proof/p8"
