[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karst41"
version = "0.0.20"
description = "A real-time multiplayer door game for NetBBS."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
# Standard library only at runtime (AGENTS.md section 1,
# 02-architecture.md section 14). Do not add anything here.
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
karst41 = "karst41.__main__:main"
# Conveniences for humans. NetBBS launches the door with the venv
# interpreter and `-m karst41.door` (02-architecture.md section 8.1).
karst41-server = "karst41.server.__main__:main"
karst41-door = "karst41.door.__main__:main"
karst41-admin = "karst41.admin.__main__:main"
karst41-bot = "karst41.bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
karst41 = ["content/**/*"]

[tool.setuptools.exclude-package-data]
# The broad content glob would otherwise ship bytecode caches.
karst41 = ["**/__pycache__/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep only failed tests' temp dirs, from the last run only (disk hygiene, AGENTS.md section 5).
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
